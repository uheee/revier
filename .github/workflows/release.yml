name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number without the v prefix, for example 0.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare release tag
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.tag.outputs.tag_name }}
    steps:
      - name: Checkout current revision
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
            TAG_NAME="v${VERSION}"

            if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid version input: ${{ inputs.version }}" >&2
              echo "Enter the version without the v prefix, for example 0.1.0." >&2
              exit 1
            fi

            git fetch --tags --force

            if git rev-parse --verify --quiet "refs/tags/${TAG_NAME}" >/dev/null; then
              echo "Tag ${TAG_NAME} already exists." >&2
              exit 1
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "${TAG_NAME}" "${GITHUB_SHA}"
            git push origin "refs/tags/${TAG_NAME}"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
          fi

          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

  checks:
    name: Checks
    runs-on: ubuntu-latest
    needs: prepare-release
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-release.outputs.tag_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  build-windows:
    name: Build Windows x64 MSI
    runs-on: windows-2025-vs2026
    needs:
      - prepare-release
      - checks
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-release.outputs.tag_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows installer
        shell: pwsh
        run: ./scripts/build.ps1 -Platform win -Arch x64 -Package

      - name: Verify Windows packaged Rust resources
        shell: pwsh
        run: |
          $resourceDir = "release/win-unpacked/resources/revier-analysis"
          if (-not (Test-Path -LiteralPath "$resourceDir/revier-analysis.exe")) {
            throw "未找到 Windows 包内 Rust 分析程序：$resourceDir/revier-analysis.exe"
          }
          if (-not (Test-Path -LiteralPath "$resourceDir/duckdb.dll")) {
            throw "未找到 Windows 包内 DuckDB 动态库：$resourceDir/duckdb.dll"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: revier-windows-x64
          path: |
            release/*.msi
          if-no-files-found: error

  build-linux:
    name: Build Linux x64 packages
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - checks
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-release.outputs.tag_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux packages
        shell: bash
        run: ./scripts/build.sh --platform linux --arch x64 --package

      - name: Verify Linux packaged Rust resources
        shell: bash
        run: |
          set -euo pipefail

          deb_file="$(find release -maxdepth 1 -name '*.deb' -print -quit)"
          rpm_file="$(find release -maxdepth 1 -name '*.rpm' -print -quit)"

          if [[ -z "$deb_file" ]]; then
            echo "未找到 Linux deb 包。" >&2
            exit 1
          fi
          if [[ -z "$rpm_file" ]]; then
            echo "未找到 Linux rpm 包。" >&2
            exit 1
          fi

          dpkg-deb --contents "$deb_file" | grep -E '/resources/revier-analysis/revier-analysis$'
          dpkg-deb --contents "$deb_file" | grep -E '/resources/revier-analysis/libduckdb\.so$'
          rpm -qlp "$rpm_file" | grep -E '/resources/revier-analysis/revier-analysis$'
          rpm -qlp "$rpm_file" | grep -E '/resources/revier-analysis/libduckdb\.so$'

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v6
        with:
          name: revier-linux-x64
          path: |
            release/*.deb
            release/*.rpm
          if-no-files-found: error

  build-macos:
    name: Build macOS x64/arm64 packages
    runs-on: macos-latest
    needs:
      - prepare-release
      - checks
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-release.outputs.tag_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS x64/arm64 packages
        shell: bash
        run: ./scripts/build.sh --platform mac --universal --package

      - name: Verify macOS Rust universal binary
        shell: bash
        run: |
          lipo -info build/revier-analysis/current/revier-analysis
          lipo -info build/revier-analysis/current/libduckdb.dylib
          lipo -verify_arch x86_64 arm64 build/revier-analysis/current/revier-analysis
          lipo -verify_arch x86_64 arm64 build/revier-analysis/current/libduckdb.dylib

      - name: Verify macOS packaged Rust resources
        shell: bash
        run: |
          set -euo pipefail

          resource_dirs="$(find release -path '*/Revier.app/Contents/Resources/revier-analysis' -type d | sort)"
          if [[ -z "$resource_dirs" ]]; then
            echo "未找到 macOS app 包内 Rust 分析资源目录。" >&2
            exit 1
          fi

          while IFS= read -r resource_dir; do
            test -x "$resource_dir/revier-analysis"
            test -f "$resource_dir/libduckdb.dylib"
            lipo -verify_arch x86_64 arm64 "$resource_dir/revier-analysis"
            lipo -verify_arch x86_64 arm64 "$resource_dir/libduckdb.dylib"
          done <<< "$resource_dirs"

          zip_files="$(find release -maxdepth 1 -name '*.zip' | sort)"
          if [[ -z "$zip_files" ]]; then
            echo "未找到 macOS zip 包。" >&2
            exit 1
          fi

          while IFS= read -r zip_file; do
            unzip -l "$zip_file" | grep -E 'Revier\.app/Contents/Resources/revier-analysis/revier-analysis$'
            unzip -l "$zip_file" | grep -E 'Revier\.app/Contents/Resources/revier-analysis/libduckdb\.dylib$'
          done <<< "$zip_files"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v6
        with:
          name: revier-macos-x64-arm64
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - build-windows
      - build-linux
      - build-macos
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag_name }}
          files: artifacts/*
          generate_release_notes: true
