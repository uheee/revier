name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number without the v prefix, for example 0.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare release tag
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.tag.outputs.tag_name }}
    steps:
      - name: Checkout current revision
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
            TAG_NAME="v${VERSION}"

            if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid version input: ${{ inputs.version }}" >&2
              echo "Enter the version without the v prefix, for example 0.1.0." >&2
              exit 1
            fi

            git fetch --tags --force

            if git rev-parse --verify --quiet "refs/tags/${TAG_NAME}" >/dev/null; then
              echo "Tag ${TAG_NAME} already exists." >&2
              exit 1
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "${TAG_NAME}" "${GITHUB_SHA}"
            git push origin "refs/tags/${TAG_NAME}"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
          fi

          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

  checks:
    name: Checks
    runs-on: ubuntu-latest
    needs: prepare-release
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-release.outputs.tag_name }}

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify no legacy runtime remains
        shell: bash
        run: |
          set -euo pipefail
          forbidden_paths=(
            electron-builder.yml
            electron.vite.config.ts
            playwright.config.ts
            src/main
            src/preload
            src/analysis-core
            src/cli
            src/shared
            tsconfig.cli.json
            tsconfig.node.json
          )

          for forbidden_path in "${forbidden_paths[@]}"; do
            if [[ -e "$forbidden_path" ]]; then
              echo "发现旧运行时路径残留：$forbidden_path" >&2
              exit 1
            fi
          done

          runtime_prefix="elect"
          runtime_suffix="ron"
          forbidden_terms=(
            "${runtime_prefix}${runtime_suffix}-(builder|vite)"
            "simple-git"
            "BrowserWindow"
            "ipcMain"
            "ipcRenderer"
            "contextBridge"
            "REVIER_USE_RUST_OVERLAY"
            "analysis-core"
          )
          scan_targets=(
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            scripts
            README.md
            .vscode
            src
          )

          for forbidden_term in "${forbidden_terms[@]}"; do
            if grep -R -E "$forbidden_term" -n "${scan_targets[@]}"; then
              echo "发现旧运行时关键字残留：$forbidden_term" >&2
              exit 1
            fi
          done

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Rust tests
        run: cargo test --workspace

      - name: Build
        run: pnpm build

  build-windows:
    name: Build for Windows
    runs-on: windows-2025-vs2026
    needs:
      - prepare-release
      - checks
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-release.outputs.tag_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set package version from release tag
        run: node scripts/set-package-version.mjs "${{ needs.prepare-release.outputs.tag_name }}"

      - name: Build for Windows
        shell: pwsh
        run: ./scripts/build.ps1 -Platform win -Arch x64 -Package

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: revier-windows-x64
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: error

  build-linux:
    name: Build for Linux
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - checks
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-release.outputs.tag_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set package version from release tag
        run: node scripts/set-package-version.mjs "${{ needs.prepare-release.outputs.tag_name }}"

      - name: Build for Linux
        shell: bash
        run: ./scripts/build.sh --platform linux --arch x64 --package

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v6
        with:
          name: revier-linux-x64
          path: |
            target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
            target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  build-macos:
    name: Build for macOS
    runs-on: macos-latest
    needs:
      - prepare-release
      - checks
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-release.outputs.tag_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set package version from release tag
        run: node scripts/set-package-version.mjs "${{ needs.prepare-release.outputs.tag_name }}"

      - name: Build for macOS
        shell: bash
        run: ./scripts/build.sh --platform mac --universal --package

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v6
        with:
          name: revier-macos-x64-arm64
          path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - build-windows
      - build-linux
      - build-macos
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag_name }}
          files: artifacts/**/*
          generate_release_notes: true
