[package]
name = "revier-tauri"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "revier_tauri"
path = "src/lib.rs"

[[bin]]
name = "revier"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
revier-analysis = { path = "../crates/revier-analysis" }
duckdb = { version = "1.10504.0", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
uuid = { version = "1", features = ["v4"] }
tokio-util = "0.7"
toml = "1.1.3"
log = "0.4.33"
tauri-plugin-log = "2.9.0"

[dev-dependencies]
tempfile = "3.10"
