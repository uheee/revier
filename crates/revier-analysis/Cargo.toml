[package]
name = "revier-analysis"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.5", features = ["derive"] }
duckdb = "1.10504.0"
gix = { version = "0.84", default-features = false, features = ["max-performance-safe", "revision", "sha1"] }
gix-attributes = "0.33"
gix-blame = "0.14"
gix-diff = { version = "0.64", features = ["blob"] }
gix-filter = "0.31"
gix-glob = "0.26"
gix-object = "0.61"
gix-worktree = { version = "0.53", default-features = false, features = ["attributes"] }
globset = "0.4"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"

[dev-dependencies]
insta = { version = "1.42", features = ["json"] }
tempfile = "3.10"
