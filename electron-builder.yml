appId: com.revier.app
productName: Revier
copyright: Copyright © 2026 Revier

asar: true
directories:
  output: release

files:
  - dist/**
  - package.json

extraResources:
  - from: build/revier-analysis/current
    to: revier-analysis
    filter:
      - "**/*"

artifactName: ${productName}-${version}-${os}-${arch}.${ext}

win:
  icon: build/icon.ico
  target:
    - target: msi
      arch:
        - x64

msi:
  artifactName: ${productName}-${version}-win-${arch}.${ext}

linux:
  icon: build/icon.png
  category: Development
  maintainer: Revier Maintainers <noreply@example.com>
  target:
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64

mac:
  icon: build/icon.icns
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
